<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="360" viewBox="0 0 1000 360"><rect width="1000" height="360" fill="white"/><text x="500" y="42" text-anchor="middle" font-family="Arial" font-size="27" font-weight="700">Responsible Human-in-the-Loop Workflow</text><g font-family="Arial" font-size="17" text-anchor="middle"><rect x="40" y="135" width="150" height="70" rx="12" fill="#dbeafe" stroke="#2563eb"/><text x="115" y="175">Text received</text><rect x="240" y="135" width="150" height="70" rx="12" fill="#e0f2fe" stroke="#0284c7"/><text x="315" y="175">Model score</text><rect x="440" y="135" width="150" height="70" rx="12" fill="#fef3c7" stroke="#d97706"/><text x="515" y="165">Confidence</text><text x="515" y="187">and scope check</text><rect x="640" y="135" width="150" height="70" rx="12" fill="#dcfce7" stroke="#16a34a"/><text x="715" y="175">Human review</text><rect x="840" y="135" width="130" height="70" rx="12" fill="#f3e8ff" stroke="#7c3aed"/><text x="905" y="165">Non-clinical</text><text x="905" y="187">action</text></g><g stroke="#374151" stroke-width="3" fill="none"><path d="M190 170 H235"/><path d="M390 170 H435"/><path d="M590 170 H635"/><path d="M790 170 H835"/></g><g fill="#374151"><polygon points="235,170 225,164 225,176"/><polygon points="435,170 425,164 425,176"/><polygon points="635,170 625,164 625,176"/><polygon points="835,170 825,164 825,176"/></g><text x="500" y="285" text-anchor="middle" font-family="Arial" font-size="16" fill="#4b5563">Low-confidence or sensitive content abstains and moves to qualified human review. The classifier never makes diagnosis or crisis decisions.</text></svg>